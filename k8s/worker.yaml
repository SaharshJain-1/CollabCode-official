apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker-sa
  namespace: collabcode
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: worker-executor-role
  namespace: collabcode
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: worker-executor-rolebinding
  namespace: collabcode
subjects:
  - kind: ServiceAccount
    name: worker-sa
    namespace: collabcode
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: worker-executor-role
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: collabcode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: worker-sa
      containers:
        - name: worker
          image: collabcode/worker:local
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: EXECUTION_NAMESPACE
              value: collabcode
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-queue-scaledobject
  namespace: collabcode
spec:
  scaleTargetRef:
    name: worker
  pollingInterval: 5
  cooldownPeriod: 60
  minReplicaCount: 1
  maxReplicaCount: 10
  triggers:
    - type: redis
      metadata:
        address: redis.collabcode.svc.cluster.local:6379
        listName: problems
        listLength: "1"
